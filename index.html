<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REMAX Paraguay | Evaluaciones</title>
<style>
:root{--red:#DC1C2D;--blue:#003DA5;--dark:#002266;--bg:#F4F6F9;--text:#1F2937}
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#eaf0f7,var(--bg));color:var(--text);min-height:100vh}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{width:min(100%,900px);background:#fff;border-radius:22px;box-shadow:0 16px 45px rgba(0,0,0,.12);overflow:hidden}
.panel-header{background:linear-gradient(135deg,var(--blue),var(--dark));color:#fff;padding:34px;border-top:7px solid var(--red);display:flex;justify-content:space-between;align-items:center;gap:20px}.panel-header h1{margin:0;font-size:29px}.panel-header p{margin:8px 0 0;color:#dbeafe}
.tests{padding:30px;display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.test{border:1px solid #e2e8f0;border-radius:18px;padding:26px;text-align:center;box-shadow:0 5px 18px rgba(0,0,0,.06)}.test h2{color:var(--blue);margin-top:0}.test p{color:#64748b;min-height:48px}.test a{display:block;text-decoration:none;background:var(--red);color:#fff;padding:13px;border-radius:10px;font-weight:800}.test a:hover{background:#b91222}.footer{text-align:center;padding:0 20px 25px;color:#64748b}@media(max-width:650px){.tests{grid-template-columns:1fr}.panel-header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<section class="screen">
 <main class="panel">
  <header class="panel-header"><div><h1>Panel de Evaluaciones</h1><p>Seleccioná el test que querés realizar.</p></div></header>
  <div class="tests">
   <article class="test"><h2>Evaluación DISC</h2><p>Evaluación de Estilos Conductuales.</p><a href="test-disc.html">Realizar Test DISC</a></article>
   <article class="test"><h2>Evaluación C.L.I.H.</h2><p>Evaluación de Valores Laborales.</p><a href="test-clih.html">Realizar Test C.L.I.H.</a></article>
  </div>
  <div class="footer">REMAX Paraguay</div>
 </main>
</section>

</body>
</html>
